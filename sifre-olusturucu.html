<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Güçlü Şifre Oluşturucu | SmartTools</title><meta name="description" content="Ücretsiz güçlü şifre oluşturucu. Şifre uzunluğunu ve karakter türlerini seç, güvenli şifreyi cihazında oluştur."><style>body{margin:0;background:#080e1c;color:#f1f7ff;font:16px system-ui,sans-serif}main{max-width:650px;margin:50px auto;padding:20px}a{color:#67e8f9}.card{background:#111d32;border:1px solid #263852;border-radius:20px;padding:25px}label{display:block;margin:18px 0}input[type=range]{width:100%}input[type=text]{width:100%;box-sizing:border-box;background:#091527;border:1px solid #435a77;color:white;padding:15px;border-radius:10px;font-size:18px}button{background:#67e8f9;border:0;border-radius:10px;padding:13px 20px;font-weight:700;margin:12px 10px 0 0;cursor:pointer}.hint{color:#a9bdd3;font-size:14px;line-height:1.6}h1{font-size:30px}</style></head><body><main><a href="./">← SmartTools ana sayfa</a><h1>🔐 Güçlü Şifre Oluşturucu</h1><div class="card"><label for="len">Şifre uzunluğu: <strong id="n">20</strong></label><input id="len" type="range" min="8" max="64" value="20"><label><input id="upper" type="checkbox" checked> Büyük harf (A-Z)</label><label><input id="lower" type="checkbox" checked> Küçük harf (a-z)</label><label><input id="digits" type="checkbox" checked> Rakam (0-9)</label><label><input id="symbols" type="checkbox" checked> Sembol (!@#...)</label><label for="output">Oluşturulan şifre</label><input id="output" type="text" readonly aria-live="polite"><button id="generate">Yeni şifre oluştur</button><button id="copy">Kopyala</button><p class="hint" id="status">Şifreniz cihazınızda oluşturulur, sunucuya gönderilmez. Güvenli bir yerde saklayın.</p></div></main><script>const $=id=>document.getElementById(id);const sets=[['upper','ABCDEFGHIJKLMNOPQRSTUVWXYZ'],['lower','abcdefghijklmnopqrstuvwxyz'],['digits','0123456789'],['symbols','!@#$%^&*()-_=+?']];function random(max){const limit=Math.floor(4294967296/max)*max;const b=new Uint32Array(1);do{crypto.getRandomValues(b)}while(b[0]>=limit);return b[0]%max}function generate(){const selected=sets.filter(([id])=>$(id).checked).map(x=>x[1]);if(!selected.length){$('status').textContent='En az bir karakter türü seçin.';return}const pool=selected.join('');const chars=selected.map(s=>s[random(s.length)]);while(chars.length<Number($('len').value))chars.push(pool[random(pool.length)]);for(let i=chars.length-1;i>0;i--){const j=random(i+1);[chars[i],chars[j]]=[chars[j],chars[i]]}$('output').value=chars.join('');$('status').textContent='Yeni şifre hazır.'}$('len').oninput=()=>{$('n').textContent=$('len').value;generate()};for(const [id] of sets)$(id).onchange=generate;$('generate').onclick=generate;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('output').value);$('status').textContent='Şifre kopyalandı.'}catch(e){$('output').select();$('status').textContent='Şifreyi seçtim; uzun basarak kopyalayabilirsiniz.'}};generate()</script></body></html>
