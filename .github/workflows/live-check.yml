name: SmartTools canlı bağlantı kontrolü
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  live-status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Public Cloudflare Pages status (no secrets)
        run: |
          sleep 16
          echo 'Activation page:'
          curl -LsS -o /dev/null -w '%{http_code}\n' --max-time 12 https://smarttools-cgv.pages.dev/pro-aktivasyon.html || true
          echo 'Shopier API connection check:'
          curl -LsS --max-time 12 -w '\nHTTP %{http_code}\n' https://smarttools-cgv.pages.dev/api/shopier/connection || true
          echo 'Shopier product and Cloudflare backend readiness:'
          curl -LsS --max-time 12 -w '\nHTTP %{http_code}\n' https://smarttools-cgv.pages.dev/api/pro/sales-ready || true
          echo 'Claim endpoint GET must require POST:'
          curl -LsS --max-time 12 -w '\nHTTP %{http_code}\n' https://smarttools-cgv.pages.dev/api/pro/claim || true
